# Legato for iOS. `xcodegen generate` (pinned in /.xcodegen-version) writes Legato.xcodeproj and Gen/;
# both are gitignored. Run it from this directory.
#
# Layout: Shared/ (the AppIntents and the Live Activity attributes) compiles into the app and the widget
# extension and must not import LegatoKit. The keyboard compiles [Keyboard, KeyboardUI] and never
# Shared/: an AppIntent inside a keyboard runs in the keyboard process, which cannot record. It links
# only LegatoKeyboardCore and LegatoVocabulary, and talks to the app over the App Group (link.* keys plus
# Darwin notes, vocabulary.json and the word-pair files read-only). The
# app compiles KeyboardUI too, for the DEBUG keyboard harness (App/Debug/KeyboardHarness.swift) that
# the simulator end-to-end run drives. The keyboard and the app link LegatoVocabulary too (the word row's
# completions and alternatives read the vocabulary and the word-pair files); only the app links the rest of
# the package.
#
# Each target carries a PrivacyInfo.xcprivacy next to its sources (App/, Widgets/, Keyboard/): the App
# Group's UserDefaults is the required-reason API every target uses (CA92.1 own defaults, 1C8F.1 same App
# Group); the app also reads file dates in the App Group container (C617.1) and elapsed time (35F9.1) for
# meetings. No tracking; the app's one collected-data entry is the opt-in "Summarize with Claude" upload.
#
# TestFlight builds are Release builds that keep the audio diagnostics and debug switches: pass
# OTHER_SWIFT_FLAGS='$(inherited) -D LEGATO_INTERNAL' to xcodebuild (leg 5). App Store builds don't.
name: Legato
options:
  bundleIdPrefix: de.gruenwald.legato
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: XWSGN23W75
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"
packages:
  LegatoKit:
    path: ../..
targets:
  Legato:
    type: application
    platform: iOS
    sources: [App, Shared, KeyboardUI]
    dependencies:
      - target: LegatoWidgets
      - target: LegatoKeyboard
      - package: LegatoKit
        product: LegatoCore
      - package: LegatoKit
        product: LegatoAudio
      - package: LegatoKit
        product: LegatoAppleSpeech
      - package: LegatoKit
        product: LegatoKeyboardCore
      - package: LegatoKit
        product: LegatoVocabulary
      # Downloadable models, engines and cleanup: the app only, never the keyboard or the widgets.
      - package: LegatoKit
        product: LegatoModels
      - package: LegatoKit
        product: LegatoFluidAudio
      - package: LegatoKit
        product: LegatoEngines
      - package: LegatoKit
        product: LegatoPostProcessing
      - package: LegatoKit
        product: LegatoMLX
      - package: LegatoKit
        product: LegatoAppServices
      # Meetings: the session, the store and the summaries; Claude is the opt-in summary backend.
      - package: LegatoKit
        product: LegatoMeetings
      - package: LegatoKit
        product: LegatoClaude
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gruenwald.legato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # APP_TARGET gates the app-only parts of Shared/. LEGATO_INTERNAL marks builds that may carry
        # the audio diagnostics and debug switches (Debug and TestFlight); App Store builds omit it.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_TARGET"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_TARGET LEGATO_INTERNAL"
    entitlements:
      path: Gen/App.entitlements
      properties:
        com.apple.security.application-groups: [group.de.gruenwald.legato]
    info:
      path: Gen/App-Info.plist
      properties:
        CFBundleDisplayName: Legato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [de.gruenwald.legato.meeting-processing]
        NSSupportsLiveActivities: true
        # Only Apple's own encryption (TLS, system frameworks): exempt, so App Store Connect stops asking.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Legato records your voice to turn it into text. For meeting notes it also saves the meeting audio on this device.
        NSSpeechRecognitionUsageDescription: Legato transcribes your speech on this device.
        CFBundleURLTypes:
          - CFBundleURLName: de.gruenwald.legato
            CFBundleURLSchemes: [legato]

  LegatoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - ../../Sources/LegatoKeyboardCore/Link/RuntimeIdentity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gruenwald.legato.widgets
    entitlements:
      path: Gen/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.de.gruenwald.legato]
    info:
      path: Gen/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Legato Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LegatoKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, KeyboardUI]
    dependencies:
      - package: LegatoKit
        product: LegatoKeyboardCore
      - package: LegatoKit
        product: LegatoVocabulary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gruenwald.legato.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Gen/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.de.gruenwald.legato]
    info:
      path: Gen/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: Legato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
