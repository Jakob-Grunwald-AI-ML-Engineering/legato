# Legato for macOS: a menu-bar dictation app. `xcodegen generate` (pinned in /.xcodegen-version) writes
# LegatoMac.xcodeproj and Gen/; both are gitignored. Run it from this directory.
#
# Non-sandboxed on purpose (Accessibility writes into other apps, a global event tap, synthesized
# paste), so distribution is Developer ID with the hardened runtime; the entitlements are the microphone and
# the calendar (meeting titles; read only, opt-in). The system-audio tap of meetings asks for its own permission at runtime. Signing, notarization and the release flow are leg 5.
name: LegatoMac
options:
  bundleIdPrefix: de.gruenwald.legato
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: XWSGN23W75
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
packages:
  LegatoKit:
    path: ../..
targets:
  Legato:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: LegatoKit
        product: LegatoDevHarness
      - package: LegatoKit
        product: LegatoCore
      - package: LegatoKit
        product: LegatoAudio
      - package: LegatoKit
        product: LegatoMac
      - package: LegatoKit
        product: LegatoComposerUI
      - package: LegatoKit
        product: LegatoAgent
      - package: LegatoKit
        product: LegatoKeyboardCore
      # Shared speech and instruction runtime.
      - package: LegatoKit
        product: LegatoAppServices
      # Meeting notes: the opt-in Claude summary backend with its Keychain key, and the session and store.
      - package: LegatoKit
        product: LegatoClaude
      - package: LegatoKit
        product: LegatoMeetings
      # The `legato` command line, copied to Contents/Helpers (not Contents/MacOS: `legato` and `Legato` are one file on a case-insensitive disk).
      - target: LegatoCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Legato
        PRODUCT_BUNDLE_IDENTIFIER: de.gruenwald.legato.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LEGATO_INTERNAL"
    entitlements:
      path: Gen/App.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        # Required by the Data Protection Keychain used for provider credentials.
        com.apple.application-identifier: "$(DEVELOPMENT_TEAM).$(PRODUCT_BUNDLE_IDENTIFIER)"
        com.apple.developer.team-identifier: "$(DEVELOPMENT_TEAM)"
    info:
      path: Gen/App-Info.plist
      properties:
        CFBundleDisplayName: Legato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Legato records your voice to compose text and, for meeting notes, to save your side of the meeting on this device.
        NSCalendarsFullAccessUsageDescription: Legato reads your calendar to title a meeting after the event happening now and to suggest its attendees as speaker names. It only reads, and only when you turn this on.
        NSAudioCaptureUsageDescription: Legato records the audio your Mac plays, to transcribe the other side of a meeting.
  # `legato meetings …` and `legato mcp`: read-only access to the meetings for agents and scripts. The same main.swift as the
  # package's `legato` product, built here so it is signed with the app's team and hardened runtime. Target and module are not
  # named `legato`: that is `Legato` (the app) to a case-insensitive disk, in the build folders too.
  LegatoCLI:
    type: tool
    platform: macOS
    sources: [../../Sources/legato]
    dependencies:
      - package: LegatoKit
        product: LegatoMeetingsCLI
    settings:
      base:
        PRODUCT_NAME: legato
        PRODUCT_MODULE_NAME: LegatoCLITool
        PRODUCT_BUNDLE_IDENTIFIER: de.gruenwald.legato.mac.cli
        SKIP_INSTALL: YES
