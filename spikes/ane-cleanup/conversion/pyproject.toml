[project]
name = "legato-ane-conversion-spike"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["coremltools==9.0", "numpy==1.26.4", "torch==2.7.0"]

[project.optional-dependencies]
full = ["transformers==4.51.3", "huggingface-hub==0.30.2", "scikit-learn==1.5.1", "safetensors==0.5.3", "sentencepiece==0.2.0", "psutil==7.0.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "pyright==1.1.407"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ane_conversion"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["checks"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
unfixable = ["F401", "F841", "B007"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "convert.py", "full_convert.py", "validate_original.py", "validate_coreml.py"]
venvPath = "."
venv = ".venv"
