# Deploy path: every push to `live` ships. `live` is only ever fast-forwarded
# from main. Deliberately no tests here: they ran once on the PR, and strict
# protection on main makes the merged tree the tested tree. Removing that
# protection turns this workflow into "ship untested".
# Target pipeline (TestFlight iOS; notarized DMG + Sparkle macOS): issue #4.
name: release

on:
  push:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: scripts/ci/release.sh
