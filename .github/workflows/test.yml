# The gate. Budget: a run takes at most 10 minutes, cold, with no cache machinery.
# Runs only in the merge queue (and by hand), on the commit that will land (main + the queued PRs ahead + this
# one), so main and live never re-test. `gate` is the one check the main ruleset requires.
#
# It covers the cleanup e2e test, `swift test` and both app builds, all against CI-only stubs of MLX,
# FluidAudio and the Hugging Face libraries (Stubs/, LEGATO_STUB_DEPS=1), so only our own code compiles.
# The real libraries, the Release builds and the binary scan run on the release path (release-checks.yml,
# on every push to `live`). Simulator scenarios are local only (scripts/e2e/ios-sim.sh).
#
# Pull requests build nothing; `gate` only reports there, so the queue accepts them.
name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # Not on pull requests: the build is the queue's job.
    if: ${{ github.event_name != 'pull_request' }}
    # Xcode (and the Metal toolchain MLX needs) is selected from .xcode-version by scripts/ci/lib.sh.
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: scripts/ci/test.sh

  # The ONE required check. always() so a failed or cancelled build-test fails this job instead of skipping it
  # (a skipped required check reads as passing). Only on pull_request may build-test be skipped.
  gate:
    needs: [build-test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: build-test succeeded (or was skipped on a pull request)
        env:
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.build-test.result }}
        run: |
          if [ "$RESULT" = success ] || { [ "$EVENT" = pull_request ] && [ "$RESULT" = skipped ]; }; then
            exit 0
          fi
          echo "::error::build-test finished as '$RESULT' on a '$EVENT' event."
          exit 1
