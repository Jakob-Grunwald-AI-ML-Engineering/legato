# Full validation runs locally with scripts/ci/test.sh before enqueueing.
# Keep the required gate on pull requests and merge groups so main still lands only through its protected queue.
# This status reports the local-validation policy; it does not execute or attest to package tests or app builds.
name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report local validation policy
        run: |
          echo '::notice::Policy: run scripts/ci/test.sh locally on the final candidate before enqueueing.'
          echo '::notice::This gate preserves the protected merge queue; it does not run or verify local tests and builds.'
