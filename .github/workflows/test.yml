# The gate. Each tree is tested in full once: in the merge queue, on the commit
# that will land (main + the queued PRs ahead + this one). PRs get a quick build
# for early feedback. No push trigger: the queue's commit IS what main becomes,
# so main and live never re-test. `gate` is the check the merge queue requires.
name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # Xcode is selected from .xcode-version by scripts/ci/lib.sh.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The mode is picked in shell, not by `if:`, so no step can silently skip.
      - name: Build (PR) or full test (merge queue, dispatch)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/ci/test.sh quick
          else
            scripts/ci/test.sh full
          fi

  # The ONE required check. always() so a failed or cancelled needed job fails
  # this one instead of skipping it (a skipped required check reads as passing).
  gate:
    needs: [build-test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job finished as '$r'."
              exit 1
            fi
          done
